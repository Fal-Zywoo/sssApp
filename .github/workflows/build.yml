name: Build Kivy APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug / release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      clean_cache:
        description: 'Force clean build cache (NDK/sdk)'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Force clean buildozer cache
        if: inputs.clean_cache == true
        run: |
          echo "🧹 强制清理所有构建缓存..."
          rm -rf .buildozer

      - name: Increase swap space
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo dd if=/dev/zero of=/swapfile bs=1M count=4096 status=progress
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev

      - name: Set JAVA_HOME to Java 17
        run: echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV

      - name: Unset conflicting Android environment variables
        run: |
          unset ANDROID_NDK ANDROID_NDK_HOME ANDROID_NDK_ROOT ANDROID_HOME ANDROID_SDK_ROOT
          echo "✅ 已清除冲突的 Android 环境变量"

      # ---------- 关键修复：安装最新 p4a 和固定 Cython ----------
      - name: Install latest python-for-android and Cython
        run: |
          pip install --upgrade pip
          pip install --upgrade Cython==0.29.36
          pip install --upgrade git+https://github.com/kivy/python-for-android@master

      # ---------- 关键修复：允许隐式函数声明（临时绕过） ----------
      - name: Allow implicit function declarations (workaround)
        run: |
          echo "CFLAGS=-Wno-error=implicit-function-declaration" >> $GITHUB_ENV
          echo "CXXFLAGS=-Wno-error=implicit-function-declaration" >> $GITHUB_ENV

      # ---------- Buildozer 安装 ----------
      - name: Install Buildozer
        run: |
          pip install buildozer

      - name: Create setup.py
        run: |
          echo "from setuptools import setup; setup(name='solarapp')" > setup.py

      # ---------- 缓存管理 ----------
      - name: Restore buildozer cache
        uses: actions/cache@v4
        id: cache-buildozer
        with:
          path: .buildozer
          key: buildozer-${{ runner.os }}-ndk25b-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-ndk25b-
            buildozer-${{ runner.os }}-

      - name: Clean old build artifacts (if cache miss)
        if: steps.cache-buildozer.outputs.cache-hit != 'true' || inputs.clean_cache == true
        run: |
          echo "🧹 清理旧构建目录（可能含有旧 NDK 产物）..."
          rm -rf .buildozer/android/platform/build-*

      # ========== 新增：手动安装 Android SDK 平台 31 ==========
      - name: Setup Android SDK with platform 31
        run: |
          # 1. 下载并解压 commandlinetools
          mkdir -p $HOME/android-sdk
          cd $HOME/android-sdk
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d cmdline-tools
          mv cmdline-tools/cmdline-tools cmdline-tools/latest
          # 2. 设置环境变量（供 Buildozer 使用）
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          # 3. 接受许可证并安装 platform 31 和 build-tools
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-31" "build-tools;31.0.0"
          # 4. 删除 Buildozer 可能下载的旧 SDK 以免冲突
          rm -rf ~/.buildozer/android/platform/android-sdk
          # 5. 验证安装
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --list | grep 'platforms;android-31'

      # ========== 新增：手动安装 Android NDK r25b 并设置路径 ==========
      - name: Setup Android NDK r25b
        run: |
          mkdir -p $HOME/android-ndk
          cd $HOME/android-ndk
          wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
          unzip -q android-ndk-r25b-linux.zip
          echo "ANDROID_NDK_HOME=$HOME/android-ndk/android-ndk-r25b" >> $GITHUB_ENV
          # 删除 Buildozer 可能下载的旧 NDK
          rm -rf ~/.buildozer/android/platform/android-ndk-*

      # ---------- 核心构建步骤（增强错误提取 + 详细日志） ----------
      - name: Build APK with verbose logging
        id: build
        run: |
          BUILD_CMD="buildozer -v android ${{ inputs.build_type }}"
          echo "🔨 执行命令: $BUILD_CMD"
          $BUILD_CMD 2>&1 | tee build.log
          EXIT_CODE=${PIPESTATUS[0]}

          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== ❌ 构建失败 (退出码: $EXIT_CODE) ==="
            echo "=== 📄 日志最后 500 行 ==="
            tail -n 500 build.log

            echo "=== 🔍 提取的关键错误行 (最多100行) ==="
            grep -E -i "error|failed|exception|killed|clang: error|traceback|undefined reference|cannot find|implicit" \
                 build.log | head -n 100 || echo "⚠️ 未找到常见错误关键词"

            grep -E -i "error|failed|exception|killed|clang: error|traceback|undefined reference|cannot find|implicit" \
                 build.log > error_summary.txt || echo "未找到错误" > error_summary.txt

            echo "### ❌ 构建失败 - 错误摘要" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat error_summary.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY

            exit $EXIT_CODE
          else
            echo "✅ 构建成功！"
            ls -la bin/*.apk || echo "⚠️ 未找到 APK 文件"
          fi

      # ---------- 上传产物 ----------
      - name: Upload APK
        if: success() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: solar-collector-${{ inputs.build_type }}
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_id }}
          path: build.log

      - name: Upload error summary
        if: failure() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: error-summary
          path: error_summary.txt
