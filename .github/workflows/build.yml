name: Build Kivy APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug / release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      clean_cache:
        description: 'Force clean build cache (NDK/sdk)'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Force clean buildozer cache
        if: inputs.clean_cache == true
        run: rm -rf .buildozer

      - name: Increase swap space
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo dd if=/dev/zero of=/swapfile bs=1M count=4096 status=progress
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev

      - name: Set JAVA_HOME to Java 17
        run: echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV

      - name: Unset conflicting Android environment variables
        run: |
          unset ANDROID_NDK ANDROID_NDK_HOME ANDROID_NDK_ROOT ANDROID_HOME ANDROID_SDK_ROOT
          echo "✅ 已清除冲突的 Android 环境变量"

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      # ----- 手动安装 Android SDK Platform 31（增强版）-----
      - name: Setup Android SDK with platform 31
        run: |
          set -e  # 任何命令失败则退出

          echo "📦 开始安装 Android SDK..."

          # 1. 准备工作
          mkdir -p $HOME/android-sdk
          cd $HOME/android-sdk

          # 2. 下载 commandlinetools（检查 wget）
          echo "⬇️ 下载 commandlinetools..."
          wget -q --show-progress https://dl.google.com/android/repository/commandlinetools-linux-6514223_latest.zip -O cmdline-tools.zip
          if [ ! -f cmdline-tools.zip ] || [ $(stat -c%s cmdline-tools.zip) -lt 1000000 ]; then
            echo "❌ 下载失败或文件不完整"
            exit 1
          fi

          # 3. 解压并处理目录嵌套
          echo "📂 解压中..."
          unzip -q cmdline-tools.zip -d cmdline-tools-temp
          if [ -d cmdline-tools-temp/cmdline-tools ]; then
            mv cmdline-tools-temp/cmdline-tools/* cmdline-tools-temp/
            rmdir cmdline-tools-temp/cmdline-tools
          fi
          mv cmdline-tools-temp cmdline-tools

          # 4. 确保 sdkmanager 可执行
          chmod +x $HOME/android-sdk/cmdline-tools/bin/sdkmanager

          # 5. 设置环境变量
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV

          # 6. 接受许可证并安装平台
          echo "✅ 接受许可证..."
          echo y | $HOME/android-sdk/cmdline-tools/bin/sdkmanager --licenses > /dev/null 2>&1 || echo "⚠️ 许可证接受可能已跳过"

          echo "📱 安装 platform 31 和 build-tools..."
          $HOME/android-sdk/cmdline-tools/bin/sdkmanager "platforms;android-31" "build-tools;31.0.0"

          # 7. 清理 Buildozer 可能自动下载的 SDK 以免冲突
          rm -rf ~/.buildozer/android/platform/android-sdk

          # 8. 验证
          echo "🔍 验证安装："
          $HOME/android-sdk/cmdline-tools/bin/sdkmanager --list | grep 'platforms;android-31' || echo "⚠️ 未找到 platform 31"

          echo "✅ Android SDK 安装完成！"

      # ----- 手动安装 Android NDK r25b -----
      - name: Setup Android NDK r25b
        run: |
          mkdir -p $HOME/android-ndk
          cd $HOME/android-ndk
          wget -q --show-progress https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
          unzip -q android-ndk-r25b-linux.zip
          echo "ANDROID_NDK_HOME=$HOME/android-ndk/android-ndk-r25b" >> $GITHUB_ENV
          rm -rf ~/.buildozer/android/platform/android-ndk-*
          echo "✅ Android NDK 安装完成！"

      # ----- 缓存管理（可选）-----
      - name: Restore buildozer cache
        uses: actions/cache@v4
        id: cache-buildozer
        with:
          path: .buildozer
          key: buildozer-${{ runner.os }}-ndk25b-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-ndk25b-
            buildozer-${{ runner.os }}-

      - name: Clean old build artifacts (if cache miss)
        if: steps.cache-buildozer.outputs.cache-hit != 'true' || inputs.clean_cache == true
        run: rm -rf .buildozer/android/platform/build-*

      # ----- 核心构建步骤 -----
      - name: Build APK with verbose logging
        id: build
        run: |
          BUILD_CMD="buildozer -v android ${{ inputs.build_type }}"
          echo "🔨 执行命令: $BUILD_CMD"
          $BUILD_CMD 2>&1 | tee build.log
          EXIT_CODE=${PIPESTATUS[0]}

          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== ❌ 构建失败 (退出码: $EXIT_CODE) ==="
            echo "=== 📄 日志最后 500 行 ==="
            tail -n 500 build.log
            echo "=== 🔍 提取的关键错误行 (最多100行) ==="
            grep -E -i "error|failed|exception|killed|clang: error|traceback|undefined reference|cannot find|implicit" \
                 build.log | head -n 100 || echo "⚠️ 未找到常见错误关键词"
            grep -E -i "error|failed|exception|killed|clang: error|traceback|undefined reference|cannot find|implicit" \
                 build.log > error_summary.txt || echo "未找到错误" > error_summary.txt
            echo "### ❌ 构建失败 - 错误摘要" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat error_summary.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $EXIT_CODE
          else
            echo "✅ 构建成功！"
            ls -la bin/*.apk || echo "⚠️ 未找到 APK 文件"
          fi

      # ----- 上传产物 -----
      - name: Upload APK
        if: success() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: solar-collector-${{ inputs.build_type }}
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_id }}
          path: build.log

      - name: Upload error summary
        if: failure() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: error-summary
          path: error_summary.txt
