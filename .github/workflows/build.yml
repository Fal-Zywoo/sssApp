name: Build Kivy APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug / release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      clean_cache:
        description: 'Force clean build cache (NDK/sdk)'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Force clean buildozer cache
        if: inputs.clean_cache == true
        run: rm -rf .buildozer

      - name: Increase swap space
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo dd if=/dev/zero of=/swapfile bs=1M count=4096 status=progress
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev

      - name: Set JAVA_HOME to Java 17
        run: echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      # ----- 缓存管理 -----
      - name: Restore buildozer cache
        uses: actions/cache@v4
        id: cache-buildozer
        with:
          path: .buildozer
          key: buildozer-${{ runner.os }}-ndk25b-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-ndk25b-
            buildozer-${{ runner.os }}-

      - name: Clean old build artifacts (if cache miss)
        if: steps.cache-buildozer.outputs.cache-hit != 'true' || inputs.clean_cache == true
        run: rm -rf .buildozer/android/platform/build-*

      # ----- 核心构建步骤（包含 SDK 自动安装和软链接修复） -----
      - name: Build APK with verbose logging
        id: build
        run: |
          # ---- 1. 调试：显示当前目录和所有文件 ----
          echo "=== 当前工作目录 ==="
          pwd
          echo "=== 文件列表 ==="
          ls -la
          echo "=== 查找 buildozer.spec ==="
          find . -name "buildozer.spec*"

          # ---- 2. 如果当前目录没有 buildozer.spec，尝试从其他位置复制 ----
          if [ ! -f buildozer.spec ]; then
            echo "⚠️ 当前目录没有 buildozer.spec，尝试从仓库根目录查找..."
            SPEC_PATH=$(find $GITHUB_WORKSPACE -name "buildozer.spec" -type f | head -1)
            if [ -n "$SPEC_PATH" ]; then
              echo "✅ 找到 spec 文件：$SPEC_PATH"
              cp "$SPEC_PATH" ./buildozer.spec
            else
              echo "❌ 错误：找不到任何 buildozer.spec 文件，退出"
              exit 1
            fi
          else
            echo "✅ buildozer.spec 已存在于当前目录"
          fi

          # ---- 3. 强制设置 Android SDK 路径 ----
          export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          # 清除系统级的 Android 环境变量
          unset ANDROID_NDK ANDROID_NDK_HOME ANDROID_NDK_ROOT
          mkdir -p "$ANDROID_HOME"

          # ---- 4. 安装 command-line tools（如果缺失） ----
          if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
            echo "⬇️ 下载 command-line tools..."
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            cd "$ANDROID_HOME/cmdline-tools"
            wget -q --show-progress https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
            unzip -q cmdline-tools.zip
            mv cmdline-tools latest
            export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
            # 接受所有许可证（静默）
            yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses > /dev/null 2>&1 || true
            # 安装 API 31 和 build-tools 31.0.0
            sdkmanager --sdk_root="$ANDROID_HOME" "platforms;android-31" "build-tools;31.0.0"
            echo "✅ API 31 安装完成"
          else
            echo "✅ command-line tools 已存在"
          fi

          # ---- 5. 创建软链接以兼容 Buildozer 的默认查找路径 ----
          mkdir -p "$ANDROID_HOME/tools/bin"
          ln -sf "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_HOME/tools/bin/sdkmanager"
          ln -sf "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" "$ANDROID_HOME/tools/bin/avdmanager"
          echo "✅ SDK 工具链接创建完成"

          # ---- 6. 回到工作目录（确保在仓库根目录） ----
          cd $GITHUB_WORKSPACE

          # ---- 7. 执行构建（默认读取当前目录的 buildozer.spec） ----
          BUILD_CMD="buildozer -v android ${{ inputs.build_type }}"
          echo "🔨 执行命令: $BUILD_CMD"
          $BUILD_CMD 2>&1 | tee build.log
          EXIT_CODE=${PIPESTATUS[0]}

          # ---- 8. 处理构建结果 ----
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== ❌ 构建失败 (退出码: $EXIT_CODE) ==="
            echo "=== 📄 日志最后 500 行 ==="
            tail -n 500 build.log
            echo "=== 🔍 提取的关键错误行 (最多100行) ==="
            grep -E -i "error|failed|exception|killed|clang: error|traceback|undefined reference|cannot find|implicit" \
                 build.log | head -n 100 || echo "⚠️ 未找到常见错误关键词"
            grep -E -i "error|failed|exception|killed|clang: error|traceback|undefined reference|cannot find|implicit" \
                 build.log > error_summary.txt || echo "未找到错误" > error_summary.txt
            echo "### ❌ 构建失败 - 错误摘要" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat error_summary.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $EXIT_CODE
          else
            echo "✅ 构建成功！"
            ls -la bin/*.apk || echo "⚠️ 未找到 APK 文件"
          fi

      # ----- 上传产物 -----
      - name: Upload APK
        if: success() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: solar-collector-${{ inputs.build_type }}
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_id }}
          path: build.log

      - name: Upload error summary
        if: failure() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: error-summary
          path: error_summary.txt
