name: Build Kivy APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug / release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      clean_cache:
        description: 'Force clean build cache (NDK/sdk)'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Force clean buildozer cache
        if: inputs.clean_cache == true
        run: rm -rf ~/.buildozer

      - name: Increase swap space
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo dd if=/dev/zero of=/swapfile bs=1M count=4096 status=progress
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev

      - name: Set JAVA_HOME to Java 17
        run: echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      # ----- 缓存管理（缓存 ~/.buildozer 整个目录） -----
      - name: Restore buildozer cache
        uses: actions/cache@v4
        id: cache-buildozer
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-ndk25b-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-ndk25b-
            buildozer-${{ runner.os }}-

      # ----- 核心构建步骤（包含强制 sdkmanager 验证与安装） -----
      - name: Build APK with verbose logging
        id: build
        run: |
          set -e  # 任何错误立即退出

          # ---- 1. 确保 buildozer.spec 存在 ----
          if [ ! -f buildozer.spec ]; then
            SPEC_PATH=$(find $GITHUB_WORKSPACE -name "buildozer.spec" -type f | head -1)
            if [ -n "$SPEC_PATH" ]; then
              cp "$SPEC_PATH" ./buildozer.spec
            else
              echo "❌ 找不到 buildozer.spec"
              exit 1
            fi
          fi

          # ---- 2. 设置 Android SDK 路径 ----
          export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME"

          # ---- 3. 检查 sdkmanager 是否已可用 ----
          SDKMANAGER_PATH="$ANDROID_HOME/tools/bin/sdkmanager"
          if [ -f "$SDKMANAGER_PATH" ] && [ -x "$SDKMANAGER_PATH" ]; then
            echo "✅ sdkmanager 已存在，跳过安装"
          else
            echo "⬇️ sdkmanager 未找到，开始下载并安装 command-line tools"

            # 清理可能损坏的旧目录
            rm -rf "$ANDROID_HOME/cmdline-tools" "$ANDROID_HOME/tools"

            # 下载 command-line tools（稳定版本）
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            cd "$ANDROID_HOME/cmdline-tools"
            CMDLINE_URL="https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip"
            wget --progress=dot:giga -O cmdline-tools.zip "$CMDLINE_URL"

            # 解压并验证
            unzip -q cmdline-tools.zip
            if [ ! -d "cmdline-tools" ]; then
              echo "❌ 解压后未找到 'cmdline-tools' 目录"
              exit 1
            fi
            mv cmdline-tools latest

            # 验证 sdkmanager 是否存在于最新目录
            if [ ! -f "latest/bin/sdkmanager" ]; then
              echo "❌ 下载的包中未找到 sdkmanager"
              exit 1
            fi

            # 创建 tools 目录并复制内容（Buildozer 要求的路径）
            mkdir -p "$ANDROID_HOME/tools"
            cp -r latest/. "$ANDROID_HOME/tools/"

            # 再次验证复制后的 sdkmanager
            if [ ! -f "$ANDROID_HOME/tools/bin/sdkmanager" ]; then
              echo "❌ 复制后 sdkmanager 仍然缺失"
              exit 1
            fi

            # 添加到 PATH 以便使用
            export PATH="$ANDROID_HOME/tools/bin:$PATH"

            # 接受许可证（必须成功）
            echo "📜 接受 Android 许可证..."
            yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses

            # 安装必要组件
            echo "📦 安装 SDK 平台和构建工具..."
            sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-31" "build-tools;31.0.0"

            echo "✅ SDK 安装完成"
          fi

          # ---- 4. 确保 PATH 包含 sdkmanager ----
          export PATH="$ANDROID_HOME/tools/bin:$PATH"

          # ---- 5. 回到工作目录 ----
          cd $GITHUB_WORKSPACE

          # ---- 6. 执行构建 ----
          BUILD_CMD="buildozer -v android ${{ inputs.build_type }}"
          echo "🔨 执行命令: $BUILD_CMD"
          $BUILD_CMD 2>&1 | tee build.log
          EXIT_CODE=${PIPESTATUS[0]}

          # ---- 7. 处理结果 ----
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== ❌ 构建失败 (退出码: $EXIT_CODE) ==="
            echo "=== 📄 日志最后 500 行 ==="
            tail -n 500 build.log
            echo "=== 🔍 提取的关键错误行 (最多100行) ==="
            grep -E -i "error|failed|exception|killed|clang: error|traceback|undefined reference|cannot find|implicit" \
                 build.log | head -n 100 || echo "⚠️ 未找到常见错误关键词"
            grep -E -i "error|failed|exception|killed|clang: error|traceback|undefined reference|cannot find|implicit" \
                 build.log > error_summary.txt || echo "未找到错误" > error_summary.txt
            echo "### ❌ 构建失败 - 错误摘要" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat error_summary.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $EXIT_CODE
          else
            echo "✅ 构建成功！"
            ls -la bin/*.apk || echo "⚠️ 未找到 APK 文件"
          fi

      # ----- 上传产物 -----
      - name: Upload APK
        if: success() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: solar-collector-${{ inputs.build_type }}
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_id }}
          path: build.log

      - name: Upload error summary
        if: failure() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: error-summary
          path: error_summary.txt
